name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Build universal app
        run: make zip UNIVERSAL=1

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: IPv6-Switch-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
